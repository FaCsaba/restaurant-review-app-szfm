name: Test Restaurant review app
on: 
  push:
    branches:
      - main
  pull_request:

jobs:
  be_testing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21 for x64
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'
          architecture: x64
          cache: 'maven'
      - name: Verify
        run: mvn -B verify -f pom.xml